{% load i18n %}{% for tag in row.languages %}<span class="cp-lang{% if not tag.written %} cp-lang--missing{% endif %}" title="{% if tag.written %}{% blocktrans with name=tag.name %}{{ name }}: written{% endblocktrans %}{% else %}{% blocktrans with name=tag.name %}{{ name }}: not written{% endblocktrans %}{% endif %}">{{ tag.label }}<span class="sr-only">{% if tag.written %}{% trans "written" %}{% else %}{% trans "not written" %}{% endif %}</span></span>{% endfor %}
