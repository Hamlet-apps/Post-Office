<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F55A8}a:hover{color:#163F7E}
</style>

<div style="width: 960px; height: 600px; box-sizing: border-box; padding: 48px; background: #F2EFEA; font-family: Inter, system-ui, sans-serif; color: #1B1F2A; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em">Post Office icon</h1>
    <span style="font-size: 15px; color: #5B6170">Two colours: postbox red #D23F2E and airmail blue #BFD8F6. No gradients.</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">

    <div style="background: #FFFFFF; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 0 0 3px #1F55A8, 0 8px 24px rgba(27,31,42,.08)">
      <svg viewBox="0 0 64 64" width="128" height="128" role="img" aria-label="Option A, pillar postbox">
        <rect width="64" height="64" rx="17" fill="#D23F2E"></rect>
        <path d="M21 51V29a11 11 0 0 1 22 0v22z" fill="#BFD8F6"></path>
        <rect x="18" y="26.5" width="28" height="5" rx="2.5" fill="#BFD8F6"></rect>
        <path d="M21 31.6H43" stroke="#D23F2E" stroke-width="1.6"></path>
        <rect x="26.5" y="36" width="11" height="3.4" rx="1.7" fill="#D23F2E"></rect>
        <rect x="17" y="49.5" width="30" height="5.5" rx="2.75" fill="#BFD8F6"></rect>
      </svg>
      <div style="display: flex; align-items: flex-end; gap: 14px">
        <svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#D23F2E"></rect><path d="M21 51V29a11 11 0 0 1 22 0v22z" fill="#BFD8F6"></path><rect x="18" y="26.5" width="28" height="5" rx="2.5" fill="#BFD8F6"></rect><rect x="26.5" y="36" width="11" height="3.4" rx="1.7" fill="#D23F2E"></rect><rect x="17" y="49.5" width="30" height="5.5" rx="2.75" fill="#BFD8F6"></rect></svg>
        <svg viewBox="0 0 64 64" width="16" height="16" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#D23F2E"></rect><path d="M21 51V29a11 11 0 0 1 22 0v22z" fill="#BFD8F6"></path><rect x="26.5" y="36" width="11" height="4" rx="2" fill="#D23F2E"></rect></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
        <span style="font-weight: 600; font-size: 15px">A · Pillar postbox</span>
        <span style="font-size: 13px; color: #5B6170">An object, like Pavilion's cloche</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 1px 2px rgba(27,31,42,.06), 0 8px 24px rgba(27,31,42,.06)">
      <svg viewBox="0 0 64 64" width="128" height="128" role="img" aria-label="Option B, envelope">
        <rect width="64" height="64" rx="17" fill="#D23F2E"></rect>
        <rect x="11" y="18" width="42" height="28" rx="5" fill="#BFD8F6"></rect>
        <path d="M15 22.5L32 34.5L49 22.5" fill="none" stroke="#D23F2E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="display: flex; align-items: flex-end; gap: 14px">
        <svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#D23F2E"></rect><rect x="11" y="18" width="42" height="28" rx="5" fill="#BFD8F6"></rect><path d="M15 22.5L32 34.5L49 22.5" fill="none" stroke="#D23F2E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <svg viewBox="0 0 64 64" width="16" height="16" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#D23F2E"></rect><rect x="11" y="18" width="42" height="28" rx="5" fill="#BFD8F6"></rect><path d="M15 22.5L32 34.5L49 22.5" fill="none" stroke="#D23F2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
        <span style="font-weight: 600; font-size: 15px">B · Envelope</span>
        <span style="font-size: 13px; color: #5B6170">Clearest at tiny sizes</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 1px 2px rgba(27,31,42,.06), 0 8px 24px rgba(27,31,42,.06)">
      <svg viewBox="0 0 64 64" width="128" height="128" role="img" aria-label="Option C, airmail envelope">
        <rect width="64" height="64" rx="17" fill="#D23F2E"></rect>
        <rect x="10" y="17" width="44" height="30" rx="5" fill="#BFD8F6"></rect>
        <rect x="14.5" y="21.5" width="35" height="21" rx="2" fill="none" stroke="#D23F2E" stroke-width="3" stroke-dasharray="4.5 3.5"></rect>
        <rect x="38" y="25" width="7.5" height="7.5" rx="1.5" fill="#D23F2E"></rect>
      </svg>
      <div style="display: flex; align-items: flex-end; gap: 14px">
        <svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#D23F2E"></rect><rect x="10" y="17" width="44" height="30" rx="5" fill="#BFD8F6"></rect><rect x="14.5" y="21.5" width="35" height="21" rx="2" fill="none" stroke="#D23F2E" stroke-width="3" stroke-dasharray="4.5 3.5"></rect><rect x="38" y="25" width="7.5" height="7.5" rx="1.5" fill="#D23F2E"></rect></svg>
        <svg viewBox="0 0 64 64" width="16" height="16" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#D23F2E"></rect><rect x="10" y="17" width="44" height="30" rx="5" fill="#BFD8F6"></rect><rect x="36" y="23" width="11" height="11" rx="2" fill="#D23F2E"></rect></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
        <span style="font-weight: 600; font-size: 15px">C · Airmail</span>
        <span style="font-size: 13px; color: #5B6170">Striped border and a stamp</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 1px 2px rgba(27,31,42,.06), 0 8px 24px rgba(27,31,42,.06)">
      <svg viewBox="0 0 64 64" width="128" height="128" role="img" aria-label="Option D, envelope in flight">
        <rect width="64" height="64" rx="17" fill="#D23F2E"></rect>
        <rect x="21" y="20" width="35" height="25" rx="4.5" fill="#BFD8F6"></rect>
        <path d="M24.5 24L38.5 34.5L52.5 24" fill="none" stroke="#D23F2E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M8 27H15M6 33H15M9 39H15" stroke="#BFD8F6" stroke-width="3.2" stroke-linecap="round"></path>
      </svg>
      <div style="display: flex; align-items: flex-end; gap: 14px">
        <svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#D23F2E"></rect><rect x="21" y="20" width="35" height="25" rx="4.5" fill="#BFD8F6"></rect><path d="M24.5 24L38.5 34.5L52.5 24" fill="none" stroke="#D23F2E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8 27H15M6 33H15M9 39H15" stroke="#BFD8F6" stroke-width="3.2" stroke-linecap="round"></path></svg>
        <svg viewBox="0 0 64 64" width="16" height="16" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#D23F2E"></rect><rect x="21" y="20" width="35" height="25" rx="4.5" fill="#BFD8F6"></rect><path d="M8 28H15M8 37H15" stroke="#BFD8F6" stroke-width="5" stroke-linecap="round"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
        <span style="font-weight: 600; font-size: 15px">D · In flight</span>
        <span style="font-size: 13px; color: #5B6170">The first one, in two colours</span>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 18px; margin-top: auto">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #5B6170">Next to its neighbours</span>
    <svg viewBox="0 0 64 64" width="48" height="48" role="img" aria-label="Town Hall"><rect width="64" height="64" rx="17" fill="#2b3a67"></rect><path d="M10.5 27L32 11.5L53.5 27Z" fill="#f6e9d2" stroke="#f6e9d2" stroke-width="3" stroke-linejoin="round"></path><rect x="15" y="27" width="34" height="25" rx="2.5" fill="#f6e9d2"></rect><circle cx="32" cy="27.5" r="7.2" fill="#2b3a67"></circle><path d="M32 23.6V27.5L34.8 29.4" fill="none" stroke="#f6e9d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M27.5 52V43.5A4.5 4.5 0 0 1 36.5 43.5V52Z" fill="#2b3a67"></path></svg>
    <svg viewBox="0 0 64 64" width="48" height="48" role="img" aria-label="Pavilion"><rect width="64" height="64" rx="17" fill="#1f4a3a"></rect><circle cx="32" cy="19.5" r="3.2" fill="#f4a93b"></circle><path d="M12 42.5A20 18.5 0 0 1 52 42.5Z" fill="#f4a93b"></path><path d="M19.5 37.5A13.5 12 0 0 1 26.5 29" fill="none" stroke="#1f4a3a" stroke-width="2.6" stroke-linecap="round"></path><path d="M9 47.5H55" stroke="#f4a93b" stroke-width="4.5" stroke-linecap="round"></path></svg>
    <svg viewBox="0 0 64 64" width="48" height="48" role="img" aria-label="Post Office, option A"><rect width="64" height="64" rx="17" fill="#D23F2E"></rect><path d="M21 51V29a11 11 0 0 1 22 0v22z" fill="#BFD8F6"></path><rect x="18" y="26.5" width="28" height="5" rx="2.5" fill="#BFD8F6"></rect><path d="M21 31.6H43" stroke="#D23F2E" stroke-width="1.6"></path><rect x="26.5" y="36" width="11" height="3.4" rx="1.7" fill="#D23F2E"></rect><rect x="17" y="49.5" width="30" height="5.5" rx="2.75" fill="#BFD8F6"></rect></svg>
  </div>
</div>
</x-dc>
